<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BRAB</title>
    <script>
      // Redireciona para index.html mantendo o path e hash (para OAuth callbacks)
      (function() {
        var pathSegmentsToKeep = 1; // Mantém /brab-site/
        var l = window.location;
        var basePath = '/brab-site';
        
        // Se houver hash (como no callback OAuth), preserva tudo
        if (l.hash && l.hash.length > 1) {
          // Redireciona para index.html com o hash preservado
          var newUrl = basePath + '/index.html' + l.hash;
          if (l.search) {
            newUrl += (l.hash.includes('?') ? '&' : '?') + l.search.substring(1);
          }
          window.location.replace(newUrl);
        } else {
          // Para rotas normais, usa o método padrão
          var path = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
          var newUrl = basePath + '/index.html';
          
          if (path) {
            newUrl += '?/' + path.replace(/&/g, '~and~');
          }
          
          if (l.search) {
            newUrl += (path ? '&' : '?') + l.search.substring(1).replace(/&/g, '~and~');
          }
          
          if (l.hash) {
            newUrl += l.hash;
          }
          
          window.location.replace(newUrl);
        }
      })();
    </script>
  </head>
  <body>
    <p>Redirecionando...</p>
  </body>
</html>
